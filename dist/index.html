<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161410">
  <meta name="description" content="经略三国 3.0 — 实时流逝行军、历史大事件抉择、名将战法与大战略统一">
  <title>经略三国 3.0</title>
  <link rel="stylesheet" href="./v2/style.css">
  <script type="module" src="./v2/main.js"></script>
</head>
<body data-immersive="false">
  <header class="v2-topbar" id="v2-topbar">
    <div class="v2-top-left">
      <button type="button" class="v2-seal" id="seal-btn" title="新开局与剧本设置" aria-label="剧本与设置">略</button>
      <div class="v2-title-meta">
        <div class="v2-title-row">
          <h1>经略三国</h1>
          <span class="v2-ver-pill">3.0</span>
          <button type="button" class="v2-weather-pill" id="v2-weather" title="当前时令天时"></button>
        </div>
        <div class="v2-date-line" id="v2-date">199年1月上旬</div>
      </div>
    </div>

    <dl class="v2-resources" aria-label="国家军政要览">
      <div title="国库银两"><dt>国库</dt><dd id="res-treasury">–</dd></div>
      <div title="全国军粮"><dt>军粮</dt><dd id="res-grain">–</dd></div>
      <div title="掌控城池数"><dt>城池</dt><dd id="res-cities">–</dd></div>
      <div title="城防与在途总兵力"><dt>总兵力</dt><dd id="res-troops">–</dd></div>
    </dl>

    <div class="v2-actions">
      <button type="button" class="v2-btn quiet" id="open-court" title="名将、军团、外交与奏报 (C)">朝堂</button>
      <button type="button" class="v2-btn quiet" id="open-log" title="战局大事纪要 (L)">奏报</button>
      <button type="button" class="v2-btn quiet" id="toggle-immersive" aria-pressed="false" title="全屏专注沙盘 (H)">全屏</button>
      <button type="button" class="v2-btn quiet" id="open-menu" title="剧本、势力、存档与音效">菜单</button>
      <button type="button" class="v2-btn secondary v2-flow-btn" id="toggle-flow" data-flowing="false" aria-pressed="false" title="实时流逝推演 / 暂停 (Space)">▶ 推演</button>
      <button type="button" class="v2-btn quiet" id="cycle-speed" title="切换流逝流速 (G)">1×</button>
      <button type="button" class="v2-btn primary" id="advance-dekad" title="手动推进一旬 (N)">+1旬</button>
    </div>
  </header>

  <button type="button" id="exit-immersive" class="v2-exit-immersive" hidden>✕ 退出全屏 (H / Esc)</button>

  <main class="v2-workspace" id="v2-workspace">
    <section class="v2-stage" id="v2-stage" aria-label="九州战略大地图">
      <canvas aria-label="九州舆图画布"></canvas>
      <div class="v2-marker-layer" aria-label="城池与军团标牌"></div>

      <div class="v2-alert-strip" id="v2-alert-strip" hidden></div>

      <div class="v2-map-tools" id="v2-map-tools">
        <button type="button" class="v2-tool-btn" id="tool-fit" title="重置全图视角">全图</button>
        <button type="button" class="v2-tool-btn" id="tool-supply" aria-pressed="false" title="显示大军粮道与补给状态">粮道</button>
        <button type="button" class="v2-tool-btn" id="tool-troops" aria-pressed="false" title="常驻显示各城兵力与兵种">兵力</button>
        <button type="button" class="v2-tool-btn" id="tool-forts" aria-pressed="false" title="显示官道名关与可筑工事锚点">工事</button>
        <button type="button" class="v2-tool-btn" id="tool-zoom-in" aria-label="放大地图">+</button>
        <button type="button" class="v2-tool-btn" id="tool-zoom-out" aria-label="缩小地图">−</button>
      </div>

      <div class="v2-ticker" id="v2-ticker" role="status" hidden></div>
      <div class="v2-tooltip" id="v2-tooltip" hidden></div>
    </section>

    <aside class="v2-inspector" id="v2-inspector" data-collapsed="true" aria-label="城池与军团指挥面板">
      <button type="button" class="v2-inspector-handle" id="inspector-handle" aria-expanded="false">
        <span class="v2-handle-grip" aria-hidden="true"></span>
        <span class="v2-handle-summary" id="inspector-handle-summary">点击地图城池或军团下达军令</span>
        <span class="v2-handle-toggle" id="inspector-handle-toggle">展开 ▴</span>
      </button>
      <div class="v2-inspector-body" id="inspector-body"></div>
    </aside>
  </main>

  <dialog id="court-dialog" class="v2-dialog" aria-labelledby="court-title">
    <div class="v2-dialog-shell">
      <header class="v2-dialog-head">
        <div>
          <h2 id="court-title">朝堂军政枢密院</h2>
          <p class="v2-dialog-sub" id="court-sub">统筹麾下将领、在途军团、多边盟约与战局奏报</p>
        </div>
        <button type="button" class="v2-btn quiet" data-close="court-dialog">关闭</button>
      </header>
      <nav class="v2-tabs" id="court-tabs" role="tablist">
        <button type="button" class="v2-tab" data-tab="officers" aria-selected="true">麾下名将</button>
        <button type="button" class="v2-tab" data-tab="cities" aria-selected="false">疆域城政</button>
        <button type="button" class="v2-tab" data-tab="armies" aria-selected="false">在途军团</button>
        <button type="button" class="v2-tab" data-tab="diplomacy" aria-selected="false">天下外交</button>
        <button type="button" class="v2-tab" data-tab="decrees" aria-selected="false">官爵国策</button>
        <button type="button" class="v2-tab" data-tab="captives" aria-selected="false">俘将处置</button>
        <button type="button" class="v2-tab" data-tab="trends" aria-selected="false">天下大势</button>
        <button type="button" class="v2-tab" data-tab="chronicle" aria-selected="false">战局奏报</button>
      </nav>
      <div class="v2-dialog-body" id="court-body"></div>
    </div>
  </dialog>

  <dialog id="menu-dialog" class="v2-dialog" aria-labelledby="menu-title">
    <div class="v2-dialog-shell">
      <header class="v2-dialog-head">
        <div>
          <h2 id="menu-title">经略三国 3.0 · 剧本与军政设置</h2>
          <p class="v2-dialog-sub">择定汉末三国十一大史实剧本，运筹实时流逝行军、名将战法与大事件博弈</p>
        </div>
        <button type="button" class="v2-btn quiet" data-close="menu-dialog">返回战局</button>
      </header>
      <div class="v2-dialog-body" id="menu-body"></div>
    </div>
  </dialog>

  <dialog id="event-dialog" class="v2-dialog v2-event-dialog" aria-labelledby="event-title">
    <div class="v2-dialog-shell">
      <header class="v2-dialog-head">
        <div>
          <h2 id="event-title">历史抉择</h2>
          <p class="v2-dialog-sub" id="event-sub">时局关键节点 · 请主公定夺</p>
        </div>
      </header>
      <div class="v2-dialog-body" id="event-body"></div>
    </div>
  </dialog>

  <dialog id="battle-dialog" class="v2-dialog v2-battle-dialog" aria-labelledby="battle-title">
    <div class="v2-dialog-shell">
      <header class="v2-dialog-head">
        <div>
          <h2 id="battle-title">战役明细复盘</h2>
          <p class="v2-dialog-sub" id="battle-sub">双方战阵、兵种相克、地形羁绊与战损详情</p>
        </div>
        <button type="button" class="v2-btn quiet" data-close="battle-dialog">关闭</button>
      </header>
      <div class="v2-dialog-body" id="battle-body"></div>
    </div>
  </dialog>

  <dialog id="outcome-dialog" class="v2-dialog" aria-labelledby="outcome-title">
    <div class="v2-dialog-shell">
      <header class="v2-dialog-head">
        <div>
          <h2 id="outcome-title">战局终结</h2>
          <p class="v2-dialog-sub" id="outcome-sub"></p>
        </div>
        <button type="button" class="v2-btn quiet" data-close="outcome-dialog">留在舆图</button>
      </header>
      <div class="v2-dialog-body" id="outcome-body"></div>
    </div>
  </dialog>
</body>
</html>
